[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smart-factory-monitor"
version = "0.1.0"
description = "A production-minded MQTT machine telemetry simulator for a Smart Factory portfolio project."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Smart Factory Monitor contributors" }]
dependencies = [
  "paho-mqtt>=2.1,<3",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112,<7",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
smart-factory-simulator = "smart_factory.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_factory"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["smart_factory"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["smart_factory"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "paho.*"
ignore_missing_imports = true
