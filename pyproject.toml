[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smart-factory-monitor"
version = "0.15.0"
description = "A Smart Factory telemetry pipeline with explainable rule-based and multivariate ML anomaly detection."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Smart Factory Monitor contributors" }]
dependencies = [
  "paho-mqtt>=2.1,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
ml = [
  "cryptography>=46,<51",
  "joblib>=1.4,<2",
  "scikit-learn>=1.5,<2",
]
dev = [
  "build>=1.2,<2",
  "cryptography>=46,<51",
  "hypothesis>=6.112,<7",
  "joblib>=1.4,<2",
  "mypy>=1.11,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "scikit-learn>=1.5,<2",
]

[project.scripts]
smart-factory-simulator = "smart_factory.main:main"
smart-factory-consumer = "smart_factory.consumer_main:main"
smart-factory-train-model = "smart_factory.train_model_main:main"
smart-factory-evaluate-model = "smart_factory.evaluate_model_main:main"
smart-factory-promote-model = "smart_factory.promote_model_main:main"
smart-factory-rollback-model = "smart_factory.rollback_model_main:main"
smart-factory-generate-model-key = "smart_factory.generate_model_key_main:main"
smart-factory-alert-dispatcher = "smart_factory.alert_dispatcher_main:main"
smart-factory-verify-audit = "smart_factory.verify_audit_main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_factory"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["smart_factory"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["smart_factory"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["joblib.*", "paho.*", "psycopg_pool.*", "sklearn.*"]
ignore_missing_imports = true
