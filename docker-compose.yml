services:
  timescaledb:
    image: timescale/timescaledb:2.29.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_factory}
      POSTGRES_USER: ${POSTGRES_USER:-smart_factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_factory_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./docker/timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 3s

  schema-migrate:
    image: timescale/timescaledb:2.29.0-pg16
    restart: "no"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-smart_factory_dev}
      POSTGRES_USER: ${POSTGRES_USER:-smart_factory}
      POSTGRES_DB: ${POSTGRES_DB:-smart_factory}
    volumes:
      - ./docker/timescaledb/migrations:/migrations:ro
      - ./docker/timescaledb/migrate.sh:/migrate.sh:ro
    command: ["sh", "/migrate.sh"]

  simulator:
    build:
      context: .
    restart: unless-stopped
    init: true
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_KEEPALIVE: ${MQTT_KEEPALIVE:-60}
      MQTT_QOS: ${MQTT_QOS:-1}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-smart-factory-simulator}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TLS_ENABLED: ${MQTT_TLS_ENABLED:-false}
      MQTT_TLS_CA_CERT_PATH: ${MQTT_TLS_CA_CERT_PATH:-}
      MQTT_TLS_CLIENT_CERT_PATH: ${MQTT_TLS_CLIENT_CERT_PATH:-}
      MQTT_TLS_CLIENT_KEY_PATH: ${MQTT_TLS_CLIENT_KEY_PATH:-}
      FACTORY_AREA: ${FACTORY_AREA:-hall-a}
      MACHINE_ID: ${MACHINE_ID:-press-01}
      PUBLISH_INTERVAL_SECONDS: ${PUBLISH_INTERVAL_SECONDS:-2.0}
      SIMULATOR_SEED: ${SIMULATOR_SEED:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  consumer:
    build:
      context: .
      args:
        PROJECT_INSTALL: ".[ml]"
    command: ["smart-factory-consumer"]
    restart: unless-stopped
    init: true
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
    environment:
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_KEEPALIVE: ${MQTT_KEEPALIVE:-60}
      MQTT_QOS: ${MQTT_QOS:-1}
      MQTT_CONSUMER_CLIENT_ID: ${MQTT_CONSUMER_CLIENT_ID:-smart-factory-consumer}
      MQTT_TOPIC_FILTER: ${MQTT_TOPIC_FILTER:-factory/+/+/telemetry}
      MQTT_SESSION_EXPIRY_SECONDS: ${MQTT_SESSION_EXPIRY_SECONDS:-86400}
      MQTT_RECEIVE_MAXIMUM: ${MQTT_RECEIVE_MAXIMUM:-20}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TLS_ENABLED: ${MQTT_TLS_ENABLED:-false}
      MQTT_TLS_CA_CERT_PATH: ${MQTT_TLS_CA_CERT_PATH:-}
      MQTT_TLS_CLIENT_CERT_PATH: ${MQTT_TLS_CLIENT_CERT_PATH:-}
      MQTT_TLS_CLIENT_KEY_PATH: ${MQTT_TLS_CLIENT_KEY_PATH:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql://smart_factory:smart_factory_dev@timescaledb:5432/smart_factory}
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-4}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10.0}
      ANOMALY_MAX_TEMPERATURE_C: ${ANOMALY_MAX_TEMPERATURE_C:-90.0}
      ANOMALY_MAX_VIBRATION_MM_S: ${ANOMALY_MAX_VIBRATION_MM_S:-7.0}
      ANOMALY_MAX_POWER_KW: ${ANOMALY_MAX_POWER_KW:-30.0}
      ANOMALY_MIN_PRODUCTION_RATE: ${ANOMALY_MIN_PRODUCTION_RATE:-25}
      ML_ANOMALY_DETECTION_ENABLED: ${ML_ANOMALY_DETECTION_ENABLED:-false}
      ML_MODEL_DIRECTORY: ${ML_MODEL_DIRECTORY:-/models}
      ML_MACHINE_IDS: ${ML_MACHINE_IDS:-press-01}
      ML_CONTAMINATION: ${ML_CONTAMINATION:-0.05}
      ML_MINIMUM_TRAINING_SAMPLES: ${ML_MINIMUM_TRAINING_SAMPLES:-100}
      ML_TRAINING_LIMIT: ${ML_TRAINING_LIMIT:-10000}
      MONITORING_HOST: 0.0.0.0
      MONITORING_PORT: 8000
    volumes:
      - ml-models:/models:ro
    ports:
      - "127.0.0.1:${MONITORING_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  model-trainer:
    build:
      context: .
      args:
        PROJECT_INSTALL: ".[ml]"
    command: ["smart-factory-train-model"]
    profiles: ["tools"]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql://smart_factory:smart_factory_dev@timescaledb:5432/smart_factory}
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-4}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10.0}
      ML_MODEL_DIRECTORY: ${ML_MODEL_DIRECTORY:-/models}
      ML_MACHINE_IDS: ${ML_MACHINE_IDS:-press-01}
      ML_CONTAMINATION: ${ML_CONTAMINATION:-0.05}
      ML_MINIMUM_TRAINING_SAMPLES: ${ML_MINIMUM_TRAINING_SAMPLES:-100}
      ML_TRAINING_LIMIT: ${ML_TRAINING_LIMIT:-10000}
    volumes:
      - ml-models:/models

volumes:
  mosquitto-data:
  mosquitto-log:
  timescaledb-data:
  ml-models:
