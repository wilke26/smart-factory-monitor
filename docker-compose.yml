services:
  timescaledb:
    image: timescale/timescaledb:2.29.0-pg16@sha256:d8336a5c9cc49bdbf1e935234e8c87ab64b6d6d195fd2ecedff7b00185557631
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_factory}
      POSTGRES_USER: ${POSTGRES_USER:-smart_factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_factory_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./docker/timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2.0.22@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    environment:
      SIMULATOR_MQTT_USERNAME: ${SIMULATOR_MQTT_USERNAME:-smart-factory-simulator}
      SIMULATOR_MQTT_PASSWORD: ${SIMULATOR_MQTT_PASSWORD:-simulator_dev}
      CONSUMER_MQTT_USERNAME: ${CONSUMER_MQTT_USERNAME:-smart-factory-consumer}
      CONSUMER_MQTT_PASSWORD: ${CONSUMER_MQTT_PASSWORD:-consumer_dev}
      FACTORY_AREA: ${FACTORY_AREA:-hall-a}
      MACHINE_ID: ${MACHINE_ID:-press-01}
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/configure-broker.sh:/usr/local/bin/configure-broker:ro
      - mosquitto-auth:/mosquitto/config-generated
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    entrypoint: ["sh", "/usr/local/bin/configure-broker"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -u \"$${CONSUMER_MQTT_USERNAME}\" -P \"$${CONSUMER_MQTT_PASSWORD}\" -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 3s

  schema-migrate:
    image: timescale/timescaledb:2.29.0-pg16@sha256:d8336a5c9cc49bdbf1e935234e8c87ab64b6d6d195fd2ecedff7b00185557631
    restart: "no"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-smart_factory_dev}
      POSTGRES_USER: ${POSTGRES_USER:-smart_factory}
      POSTGRES_DB: ${POSTGRES_DB:-smart_factory}
    volumes:
      - ./docker/timescaledb/migrations:/migrations:ro
      - ./docker/timescaledb/migrate.sh:/migrate.sh:ro
    command: ["sh", "/migrate.sh"]

  simulator:
    build:
      context: .
    restart: unless-stopped
    init: true
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_KEEPALIVE: ${MQTT_KEEPALIVE:-60}
      MQTT_QOS: ${MQTT_QOS:-1}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-smart-factory-simulator}
      MQTT_USERNAME: ${SIMULATOR_MQTT_USERNAME:-smart-factory-simulator}
      MQTT_PASSWORD: ${SIMULATOR_MQTT_PASSWORD:-simulator_dev}
      MQTT_TLS_ENABLED: ${MQTT_TLS_ENABLED:-false}
      MQTT_TLS_CA_CERT_PATH: ${MQTT_TLS_CA_CERT_PATH:-}
      MQTT_TLS_CLIENT_CERT_PATH: ${MQTT_TLS_CLIENT_CERT_PATH:-}
      MQTT_TLS_CLIENT_KEY_PATH: ${MQTT_TLS_CLIENT_KEY_PATH:-}
      FACTORY_AREA: ${FACTORY_AREA:-hall-a}
      MACHINE_ID: ${MACHINE_ID:-press-01}
      PUBLISH_INTERVAL_SECONDS: ${PUBLISH_INTERVAL_SECONDS:-2.0}
      SIMULATOR_SEED: ${SIMULATOR_SEED:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  consumer:
    build:
      context: .
      args:
        PROJECT_INSTALL: ".[ml]"
    command: ["smart-factory-consumer"]
    restart: unless-stopped
    init: true
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
      model-key-init:
        condition: service_completed_successfully
    environment:
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_KEEPALIVE: ${MQTT_KEEPALIVE:-60}
      MQTT_QOS: ${MQTT_QOS:-1}
      MQTT_CONSUMER_CLIENT_ID: ${MQTT_CONSUMER_CLIENT_ID:-smart-factory-consumer}
      MQTT_TOPIC_FILTER: ${MQTT_TOPIC_FILTER:-factory/+/+/telemetry}
      MQTT_SESSION_EXPIRY_SECONDS: ${MQTT_SESSION_EXPIRY_SECONDS:-86400}
      MQTT_RECEIVE_MAXIMUM: ${MQTT_RECEIVE_MAXIMUM:-20}
      MQTT_USERNAME: ${CONSUMER_MQTT_USERNAME:-smart-factory-consumer}
      MQTT_PASSWORD: ${CONSUMER_MQTT_PASSWORD:-consumer_dev}
      MQTT_TLS_ENABLED: ${MQTT_TLS_ENABLED:-false}
      MQTT_TLS_CA_CERT_PATH: ${MQTT_TLS_CA_CERT_PATH:-}
      MQTT_TLS_CLIENT_CERT_PATH: ${MQTT_TLS_CLIENT_CERT_PATH:-}
      MQTT_TLS_CLIENT_KEY_PATH: ${MQTT_TLS_CLIENT_KEY_PATH:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql://smart_factory:smart_factory_dev@timescaledb:5432/smart_factory}
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-4}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10.0}
      ANOMALY_MAX_TEMPERATURE_C: ${ANOMALY_MAX_TEMPERATURE_C:-90.0}
      ANOMALY_MAX_VIBRATION_MM_S: ${ANOMALY_MAX_VIBRATION_MM_S:-7.0}
      ANOMALY_MAX_POWER_KW: ${ANOMALY_MAX_POWER_KW:-30.0}
      ANOMALY_MIN_PRODUCTION_RATE: ${ANOMALY_MIN_PRODUCTION_RATE:-25}
      ML_ANOMALY_DETECTION_ENABLED: ${ML_ANOMALY_DETECTION_ENABLED:-false}
      ML_MODEL_DIRECTORY: ${ML_MODEL_DIRECTORY:-/models}
      ML_MACHINE_IDS: ${ML_MACHINE_IDS:-press-01}
      ML_CONTAMINATION: ${ML_CONTAMINATION:-0.05}
      ML_MINIMUM_TRAINING_SAMPLES: ${ML_MINIMUM_TRAINING_SAMPLES:-100}
      ML_TRAINING_LIMIT: ${ML_TRAINING_LIMIT:-10000}
      ML_SIGNATURE_PUBLIC_KEY_PATH: /run/ml-signing/public/public.pem
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_ALLOW_INSECURE_HTTP: ${ALERT_WEBHOOK_ALLOW_INSECURE_HTTP:-false}
      ALERT_MINIMUM_SEVERITY: ${ALERT_MINIMUM_SEVERITY:-high}
      MONITORING_HOST: 0.0.0.0
      MONITORING_PORT: 8000
    volumes:
      - ml-models:/models:ro
      - ml-signing-public:/run/ml-signing/public:ro
    ports:
      - "127.0.0.1:${MONITORING_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  model-key-init:
    build:
      context: .
      args:
        PROJECT_INSTALL: ".[ml]"
    command: ["smart-factory-generate-model-key"]
    restart: "no"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ML_SIGNING_PRIVATE_KEY_PATH: /run/ml-signing/private/private.pem
      ML_SIGNATURE_PUBLIC_KEY_PATH: /run/ml-signing/public/public.pem
    volumes:
      - ml-signing-private:/run/ml-signing/private
      - ml-signing-public:/run/ml-signing/public

  model-trainer:
    build:
      context: .
      args:
        PROJECT_INSTALL: ".[ml]"
    command: ["smart-factory-train-model"]
    profiles: ["tools"]
    depends_on:
      timescaledb:
        condition: service_healthy
      model-key-init:
        condition: service_completed_successfully
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql://smart_factory:smart_factory_dev@timescaledb:5432/smart_factory}
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-4}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10.0}
      ML_MODEL_DIRECTORY: ${ML_MODEL_DIRECTORY:-/models}
      ML_MACHINE_IDS: ${ML_MACHINE_IDS:-press-01}
      ML_CONTAMINATION: ${ML_CONTAMINATION:-0.05}
      ML_MINIMUM_TRAINING_SAMPLES: ${ML_MINIMUM_TRAINING_SAMPLES:-100}
      ML_TRAINING_LIMIT: ${ML_TRAINING_LIMIT:-10000}
      ML_SIGNING_PRIVATE_KEY_PATH: /run/ml-signing/private/private.pem
    volumes:
      - ml-models:/models
      - ml-signing-private:/run/ml-signing/private:ro

  model-evaluator:
    build:
      context: .
      args:
        PROJECT_INSTALL: ".[ml]"
    command: ["smart-factory-evaluate-model"]
    profiles: ["tools"]
    depends_on:
      timescaledb:
        condition: service_healthy
      model-key-init:
        condition: service_completed_successfully
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql://smart_factory:smart_factory_dev@timescaledb:5432/smart_factory}
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-4}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10.0}
      ML_MODEL_DIRECTORY: ${ML_MODEL_DIRECTORY:-/models}
      ML_MACHINE_IDS: ${ML_MACHINE_IDS:-press-01}
      ML_EVALUATION_MINIMUM_SAMPLES: ${ML_EVALUATION_MINIMUM_SAMPLES:-30}
      ML_EVALUATION_LIMIT: ${ML_EVALUATION_LIMIT:-1000}
      ML_MAX_EVALUATION_ANOMALY_RATE: ${ML_MAX_EVALUATION_ANOMALY_RATE:-0.15}
      ML_MAX_FEATURE_PSI: ${ML_MAX_FEATURE_PSI:-0.25}
      ML_SIGNATURE_PUBLIC_KEY_PATH: /run/ml-signing/public/public.pem
    volumes:
      - ml-models:/models:ro
      - ml-signing-public:/run/ml-signing/public:ro

  model-promoter:
    build:
      context: .
      args:
        PROJECT_INSTALL: ".[ml]"
    command: ["smart-factory-promote-model"]
    profiles: ["tools"]
    depends_on:
      timescaledb:
        condition: service_healthy
      model-key-init:
        condition: service_completed_successfully
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql://smart_factory:smart_factory_dev@timescaledb:5432/smart_factory}
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-4}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10.0}
      ML_MODEL_DIRECTORY: ${ML_MODEL_DIRECTORY:-/models}
      ML_MACHINE_IDS: ${ML_MACHINE_IDS:-press-01}
      ML_SIGNATURE_PUBLIC_KEY_PATH: /run/ml-signing/public/public.pem
    volumes:
      - ml-models:/models
      - ml-signing-public:/run/ml-signing/public:ro

  model-rollback:
    build:
      context: .
      args:
        PROJECT_INSTALL: ".[ml]"
    command: ["smart-factory-rollback-model"]
    profiles: ["tools"]
    depends_on:
      model-key-init:
        condition: service_completed_successfully
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ML_MODEL_DIRECTORY: ${ML_MODEL_DIRECTORY:-/models}
      ML_MACHINE_IDS: ${ML_MACHINE_IDS:-press-01}
      ML_SIGNATURE_PUBLIC_KEY_PATH: /run/ml-signing/public/public.pem
      ML_ROLLBACK_GENERATION_ID: ${ML_ROLLBACK_GENERATION_ID:-}
    volumes:
      - ml-models:/models
      - ml-signing-public:/run/ml-signing/public:ro

  alert-dispatcher:
    build:
      context: .
    command: ["smart-factory-alert-dispatcher"]
    profiles: ["alerts"]
    restart: unless-stopped
    init: true
    depends_on:
      timescaledb:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql://smart_factory:smart_factory_dev@timescaledb:5432/smart_factory}
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE:-1}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-4}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10.0}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_ALLOW_INSECURE_HTTP: ${ALERT_WEBHOOK_ALLOW_INSECURE_HTTP:-false}
      ALERT_WEBHOOK_BEARER_TOKEN: ${ALERT_WEBHOOK_BEARER_TOKEN:-}
      ALERT_WEBHOOK_CA_CERT_PATH: ${ALERT_WEBHOOK_CA_CERT_PATH:-}
      ALERT_MINIMUM_SEVERITY: ${ALERT_MINIMUM_SEVERITY:-high}
      ALERT_BATCH_SIZE: ${ALERT_BATCH_SIZE:-20}
      ALERT_POLL_INTERVAL_SECONDS: ${ALERT_POLL_INTERVAL_SECONDS:-2.0}
      ALERT_REQUEST_TIMEOUT_SECONDS: ${ALERT_REQUEST_TIMEOUT_SECONDS:-5.0}
      ALERT_LEASE_SECONDS: ${ALERT_LEASE_SECONDS:-120}
      ALERT_RETRY_BASE_SECONDS: ${ALERT_RETRY_BASE_SECONDS:-5.0}
      ALERT_RETRY_MAX_SECONDS: ${ALERT_RETRY_MAX_SECONDS:-300.0}

volumes:
  mosquitto-auth:
  mosquitto-data:
  mosquitto-log:
  timescaledb-data:
  ml-models:
  ml-signing-private:
  ml-signing-public:
