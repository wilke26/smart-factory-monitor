name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install project
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --require-hashes -r requirements/build.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Verify dependency locks are current
        if: matrix.python-version == '3.12'
        env:
          CUSTOM_COMPILE_COMMAND: python -m piptools compile --allow-unsafe --generate-hashes --strip-extras
        run: |
          python -m piptools compile --allow-unsafe --generate-hashes --strip-extras --no-emit-index-url --no-emit-trusted-host --output-file requirements/runtime.lock pyproject.toml
          python -m piptools compile --allow-unsafe --generate-hashes --strip-extras --no-emit-index-url --no-emit-trusted-host --extra ml --output-file requirements/ml.lock pyproject.toml
          python -m piptools compile --allow-unsafe --generate-hashes --strip-extras --no-emit-index-url --no-emit-trusted-host --extra dev --extra ml --output-file requirements/dev.lock pyproject.toml
          python -m piptools compile --allow-unsafe --generate-hashes --strip-extras --no-emit-index-url --no-emit-trusted-host --output-file requirements/build.lock requirements/build.in
          git diff --exit-code -- requirements
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Audit Python dependencies
        run: python -m pip_audit
      - name: Test
        run: pytest --cov=smart_factory --cov-report=term-missing --cov-report=xml
      - name: Build package
        run: python -m build --no-isolation

  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, compose]
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      release_revision: ${{ steps.version.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/build.lock
      - name: Verify release tag matches package version
        id: version
        run: |
          set -euo pipefail
          package_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          expected_tag="v${package_version}"
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          verified_tag_ref="refs/release-tags/${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "::error title=Release version mismatch::Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi
          if [ "${GITHUB_REF}" != "${tag_ref}" ]; then
            echo "::error title=Unexpected release ref::Expected ${tag_ref}, received ${GITHUB_REF}."
            exit 1
          fi
          git fetch --force --no-tags origin \
            "${tag_ref}:${verified_tag_ref}" \
            "refs/heads/main:refs/remotes/origin/main"
          tag_type=$(git cat-file -t "${verified_tag_ref}" 2>/dev/null || true)
          if [ "${tag_type}" != "tag" ]; then
            echo "::error title=Untrusted release tag::Remote ${tag_ref} must be an annotated tag; observed object type: ${tag_type:-missing}."
            exit 1
          fi
          release_commit=$(git rev-parse "${verified_tag_ref}^{commit}")
          if ! git merge-base --is-ancestor "${release_commit}" \
            refs/remotes/origin/main; then
            echo "::error title=Release is not on main::Commit ${release_commit} is not reachable from origin/main."
            exit 1
          fi
          echo "Verified annotated release tag ${GITHUB_REF_NAME} at ${release_commit}."
          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "release_commit=${release_commit}" >> "${GITHUB_OUTPUT}"
      - name: Build package from locked tools
        run: |
          python -m pip install --require-hashes -r requirements/build.lock
          python -m build --no-isolation
          python -m pip install --require-hashes \
            --target "${RUNNER_TEMP}/smart-factory-ml-runtime" \
            -r requirements/ml.lock
          python -m pip install --no-deps \
            --target "${RUNNER_TEMP}/smart-factory-ml-runtime" \
            "dist/smart_factory_monitor-${{ steps.version.outputs.package_version }}-py3-none-any.whl"
      - name: Generate private SPDX ML-runtime SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ runner.temp }}/smart-factory-ml-runtime
          format: spdx-json
          output-file: ${{ runner.temp }}/smart_factory_monitor-${{ steps.version.outputs.package_version }}.ml-runtime.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
      - name: Encrypt private SBOM for durable retention
        env:
          RECIPIENT_PUBLIC_KEY: ${{ secrets.RELEASE_EVIDENCE_RECIPIENT_PUBLIC_KEY }}
        run: |
          if [ -z "${RECIPIENT_PUBLIC_KEY}" ]; then
            echo "::error title=Missing release evidence recipient::Configure RELEASE_EVIDENCE_RECIPIENT_PUBLIC_KEY before creating a release tag."
            exit 1
          fi
          umask 077
          printf '%s\n' "${RECIPIENT_PUBLIC_KEY}" > "${RUNNER_TEMP}/release-evidence-recipient.pem"
          PYTHONPATH="${RUNNER_TEMP}/smart-factory-ml-runtime" \
            python scripts/release_evidence_crypto.py encrypt \
              --input "${RUNNER_TEMP}/smart_factory_monitor-${{ steps.version.outputs.package_version }}.ml-runtime.spdx.json" \
              --output "dist/smart_factory_monitor-${{ steps.version.outputs.package_version }}.ml-runtime.spdx.json.enc" \
              --public-key "${RUNNER_TEMP}/release-evidence-recipient.pem" \
              --version "${{ steps.version.outputs.package_version }}" \
              --revision "${{ github.sha }}"
      - name: Create deterministic release evidence
        run: |
          python scripts/create_release_evidence.py \
            --directory dist \
            --version "${{ steps.version.outputs.package_version }}" \
            --revision "${{ github.sha }}" \
            --sbom "${RUNNER_TEMP}/smart_factory_monitor-${{ steps.version.outputs.package_version }}.ml-runtime.spdx.json" \
            --encrypted-sbom "dist/smart_factory_monitor-${{ steps.version.outputs.package_version }}.ml-runtime.spdx.json.enc"
          cd dist
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -type f -name '*.spdx.json' | wc -l | tr -d ' ')" = "0"
      - name: Pass encrypted source evidence to isolated jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smart-factory-monitor-source-evidence-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release-container:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
      reference: ${{ steps.publish.outputs.reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Define immutable container coordinates
        id: coordinates
        env:
          RELEASE_REVISION: ${{ needs.release-build.outputs.release_revision }}
          RELEASE_VERSION: ${{ needs.release-build.outputs.package_version }}
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${RELEASE_REVISION}"
          image=$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "tag=${image}:${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Authenticate and require an unused release tag
        env:
          IMAGE_TAG: ${{ steps.coordinates.outputs.tag }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_TOKEN}" | \
            docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          set +e
          inspection=$(docker buildx imagetools inspect "${IMAGE_TAG}" 2>&1)
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            echo "::error title=Container tag already exists::${IMAGE_TAG} is immutable release history and will not be overwritten."
            exit 1
          fi
          if ! printf '%s\n' "${inspection}" | grep -Eiq 'not found|manifest unknown'; then
            printf '%s\n' "${inspection}"
            echo "::error title=Registry lookup failed::Could not prove that ${IMAGE_TAG} is unused."
            exit 1
          fi
      - name: Build release container once
        env:
          IMAGE_TAG: ${{ steps.coordinates.outputs.tag }}
          RELEASE_REVISION: ${{ needs.release-build.outputs.release_revision }}
          RELEASE_VERSION: ${{ needs.release-build.outputs.package_version }}
        run: |
          created=$(git show -s --format=%cI "${RELEASE_REVISION}")
          docker build --pull --platform linux/amd64 \
            --build-arg DEPENDENCY_LOCK=requirements/ml.lock \
            --label "org.opencontainers.image.created=${created}" \
            --label "org.opencontainers.image.revision=${RELEASE_REVISION}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${RELEASE_VERSION}" \
            --tag "${IMAGE_TAG}" .
      - name: Scan exact release container before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.coordinates.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
      - name: Publish release container and resolve registry digest
        id: publish
        env:
          IMAGE: ${{ steps.coordinates.outputs.image }}
          IMAGE_TAG: ${{ steps.coordinates.outputs.tag }}
        run: |
          set -euo pipefail
          docker push "${IMAGE_TAG}"
          inspection=$(docker buildx imagetools inspect "${IMAGE_TAG}")
          printf '%s\n' "${inspection}"
          digest=$(printf '%s\n' "${inspection}" | awk '$1 == "Digest:" {print $2; exit}')
          if ! printf '%s' "${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error title=Missing container digest::Registry did not return a canonical SHA-256 digest."
            exit 1
          fi
          docker pull "${IMAGE}@${digest}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "reference=${IMAGE}@${digest}" >> "${GITHUB_OUTPUT}"
      - name: Generate private SPDX container SBOM from published digest
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.publish.outputs.reference }}
          format: spdx-json
          output-file: ${{ runner.temp }}/smart_factory_monitor-${{ needs.release-build.outputs.package_version }}.container.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
      - name: Encrypt container SBOM with the external release recipient
        env:
          IMAGE_TAG: ${{ steps.coordinates.outputs.tag }}
          RECIPIENT_PUBLIC_KEY: ${{ secrets.RELEASE_EVIDENCE_RECIPIENT_PUBLIC_KEY }}
          RELEASE_REVISION: ${{ needs.release-build.outputs.release_revision }}
          RELEASE_VERSION: ${{ needs.release-build.outputs.package_version }}
        run: |
          set -euo pipefail
          if [ -z "${RECIPIENT_PUBLIC_KEY}" ]; then
            echo "::error title=Missing release evidence recipient::Configure RELEASE_EVIDENCE_RECIPIENT_PUBLIC_KEY before creating a release tag."
            exit 1
          fi
          umask 077
          mkdir container-dist
          printf '%s\n' "${RECIPIENT_PUBLIC_KEY}" > "${RUNNER_TEMP}/release-evidence-recipient.pem"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --volume "${RUNNER_TEMP}:/evidence" \
            --volume "${GITHUB_WORKSPACE}/container-dist:/output" \
            "${IMAGE_TAG}" \
            python /workspace/scripts/release_evidence_crypto.py encrypt \
              --input "/evidence/smart_factory_monitor-${RELEASE_VERSION}.container.spdx.json" \
              --output "/output/smart_factory_monitor-${RELEASE_VERSION}.container.spdx.json.enc" \
              --public-key /evidence/release-evidence-recipient.pem \
              --version "${RELEASE_VERSION}" \
              --revision "${RELEASE_REVISION}"
      - name: Create digest-bound container evidence
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          RELEASE_REVISION: ${{ needs.release-build.outputs.release_revision }}
          RELEASE_VERSION: ${{ needs.release-build.outputs.package_version }}
        run: |
          python scripts/create_container_evidence.py \
            --directory container-dist \
            --version "${RELEASE_VERSION}" \
            --revision "${RELEASE_REVISION}" \
            --image "${IMAGE}" \
            --digest "${IMAGE_DIGEST}" \
            --platform linux/amd64 \
            --sbom "${RUNNER_TEMP}/smart_factory_monitor-${RELEASE_VERSION}.container.spdx.json" \
            --encrypted-sbom "container-dist/smart_factory_monitor-${RELEASE_VERSION}.container.spdx.json.enc"
          cd container-dist
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -type f -name '*.spdx.json' | wc -l | tr -d ' ')" = "0"
      - name: Pass checksummed container evidence to unprivileged assembly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smart-factory-monitor-container-evidence-${{ github.ref_name }}
          path: container-dist/
          if-no-files-found: error
          retention-days: 1

  release-assemble:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-build, release-container]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.container.outputs.image }}
      digest: ${{ steps.container.outputs.digest }}
      release_revision: ${{ steps.container.outputs.release_revision }}
      release_version: ${{ steps.container.outputs.release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - name: Download encrypted source evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smart-factory-monitor-source-evidence-${{ github.ref_name }}
          path: source-dist
      - name: Download encrypted container evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smart-factory-monitor-container-evidence-${{ github.ref_name }}
          path: container-dist
      - name: Verify isolated evidence transfers
        run: |
          cd source-dist && sha256sum --check SHA256SUMS
          cd ../container-dist && sha256sum --check SHA256SUMS
      - name: Read fail-closed container identity
        id: container
        env:
          RELEASE_REVISION: ${{ needs.release-build.outputs.release_revision }}
          RELEASE_VERSION: ${{ needs.release-build.outputs.package_version }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          evidence = json.loads(Path("container-dist/container-evidence.json").read_text())
          container = evidence["container"]
          image = container["image"]
          digest = container["digest"]
          image_pattern = re.compile(
              r"^[a-z0-9](?:[a-z0-9._-]*[a-z0-9])?(?::[0-9]+)?"
              r"(?:/[a-z0-9](?:[a-z0-9._-]*[a-z0-9])?)+$"
          )
          if not image_pattern.fullmatch(image):
              raise SystemExit("container evidence contains an invalid image name")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("container evidence contains an invalid image digest")
          revision = os.environ["RELEASE_REVISION"]
          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("release evidence contains an invalid revision")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("release evidence contains an invalid version")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"image={image}\n")
              output.write(f"digest={digest}\n")
              output.write(f"release_revision={revision}\n")
              output.write(f"release_version={version}\n")
          PY
      - name: Render digest-bound Kubernetes release manifest
        env:
          IMAGE: ${{ steps.container.outputs.image }}
          IMAGE_DIGEST: ${{ steps.container.outputs.digest }}
          RELEASE_VERSION: ${{ needs.release-build.outputs.package_version }}
        run: |
          python deploy/kubernetes/render-release.py \
            --image "${IMAGE}" \
            --digest "${IMAGE_DIGEST}" \
            --output "${RUNNER_TEMP}/smart_factory_monitor-${RELEASE_VERSION}.kubernetes.yaml"
      - name: Assemble final release evidence without publication permission
        env:
          RELEASE_VERSION: ${{ needs.release-build.outputs.package_version }}
        run: |
          python scripts/assemble_release_evidence.py \
            --source-directory source-dist \
            --container-directory container-dist \
            --output-directory dist \
            --deployment-manifest "${RUNNER_TEMP}/smart_factory_monitor-${RELEASE_VERSION}.kubernetes.yaml"
          cd dist
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -type f -name '*.spdx.json' | wc -l | tr -d ' ')" = "0"
      - name: Verify complete release bundle offline
        env:
          IMAGE: ${{ steps.container.outputs.image }}
          IMAGE_DIGEST: ${{ steps.container.outputs.digest }}
          RELEASE_REVISION: ${{ needs.release-build.outputs.release_revision }}
          RELEASE_VERSION: ${{ needs.release-build.outputs.package_version }}
        run: |
          PYTHONPATH=src python -m smart_factory.release_verification dist \
            --expected-version "${RELEASE_VERSION}" \
            --expected-revision "${RELEASE_REVISION}" \
            --expected-image-reference "${IMAGE}@${IMAGE_DIGEST}"
      - name: Pass final encrypted release evidence to isolated jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smart-factory-monitor-release-evidence-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release-attest:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event.repository.visibility == 'public' ||
      vars.ENABLE_GITHUB_ATTESTATIONS == 'true')
    needs: release-assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download checksummed release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smart-factory-monitor-release-evidence-${{ github.ref_name }}
          path: dist
      - name: Verify transferred release evidence
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Attest package build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest published container digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.release-assemble.outputs.image }}
          subject-digest: ${{ needs.release-assemble.outputs.digest }}

  release-draft:
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.release-assemble.result == 'success' &&
      (needs.release-attest.result == 'success' ||
      needs.release-attest.result == 'skipped')
    needs: [release-assemble, release-attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download encrypted release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smart-factory-monitor-release-evidence-${{ github.ref_name }}
          path: dist
      - name: Verify and create unsigned release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" ./* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --verify-tag \
            --title "Smart Factory Monitor ${GITHUB_REF_NAME}" \
            --notes "Unsigned draft containing checksummed packages, digest-bound Kubernetes deployment evidence, and encrypted ML-runtime and container SBOMs for ${{ needs.release-assemble.outputs.release_revision }}. Expected version: ${{ needs.release-assemble.outputs.release_version }}. Expected container: ${{ needs.release-assemble.outputs.image }}@${{ needs.release-assemble.outputs.digest }}. Publish only after the externally controlled release signature has been uploaded and independently verified."
      - name: Report private-repository attestation mode
        if: >-
          github.event.repository.visibility != 'public' &&
          vars.ENABLE_GITHUB_ATTESTATIONS != 'true'
        run: |
          echo "::notice title=GitHub attestation skipped::Private repositories require GitHub Enterprise Cloud. Durable encrypted package and container evidence was prepared as a draft."
          {
            echo "### GitHub provenance not created"
            echo "This private repository has not enabled Enterprise Cloud artifact attestations."
            echo "Checksummed package and container evidence plus both encrypted SBOMs are attached to the unsigned draft."
          } >> "${GITHUB_STEP_SUMMARY}"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - name: Render Kubernetes deployment overlays
        run: |
          kubectl kustomize deploy/kubernetes/base > /tmp/smart-factory-base.yaml
          kubectl kustomize deploy/kubernetes/overlays/azure > /tmp/smart-factory-azure.yaml
          kubectl kustomize deploy/kubernetes/policies > /tmp/smart-factory-policies.yaml
          python deploy/kubernetes/render-release.py \
            --image smartfactory.azurecr.io/smart-factory-monitor \
            --digest sha256:1111111111111111111111111111111111111111111111111111111111111111 \
            --output /tmp/smart-factory-release.yaml
          grep -q 'azurefile-csi-premium' /tmp/smart-factory-azure.yaml
          grep -q 'storage: 100Gi' /tmp/smart-factory-azure.yaml
          grep -q 'runAsNonRoot: true' /tmp/smart-factory-azure.yaml
          grep -q 'runAsUser: 10001' /tmp/smart-factory-azure.yaml
          grep -q 'kind: NetworkPolicy' /tmp/smart-factory-azure.yaml
          grep -q 'smart-factory-alert-dispatcher' /tmp/smart-factory-azure.yaml
          grep -q 'smart-factory-alert-dispatcher' /tmp/smart-factory-base.yaml
          test "$(grep -c 'image: smartfactory.azurecr.io/smart-factory-monitor@sha256:1111111111111111111111111111111111111111111111111111111111111111' /tmp/smart-factory-release.yaml)" = "3"
      - name: Build application images
        run: docker compose build simulator consumer alert-dispatcher model-key-init model-trainer model-evaluator model-promoter model-rollback audit-verifier audit-key-init audit-key-rotator audit-checkpoint-exporter audit-checkpoint-verifier recovery-model-verifier
      - name: Scan consumer image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: smart-factory-monitor-consumer:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
      - name: Start broker and database, then train an ML artifact
        run: |
          docker compose up -d --wait mosquitto timescaledb
          docker compose run --rm schema-migrate
          docker compose exec -T timescaledb psql \
            -U smart_factory -d smart_factory -v ON_ERROR_STOP=1 \
            -c "INSERT INTO telemetry_readings (machine_id, recorded_at, temperature_c, vibration_mm_s, power_kw, production_rate) SELECT machine_id, NOW() - number * INTERVAL '1 second', 68 + (number % 5) * 0.1, 2.5 + (number % 7) * 0.02, 17 + (number % 3) * 0.1, 44 + (number % 2) FROM (VALUES ('press-01'), ('press-02')) AS machines(machine_id) CROSS JOIN generate_series(1, 120) AS number;"
          ML_MACHINE_IDS=press-01,press-02 docker compose --profile tools run --rm model-trainer
          sleep 1
          docker compose exec -T timescaledb psql \
            -U smart_factory -d smart_factory -v ON_ERROR_STOP=1 \
            -c "INSERT INTO telemetry_readings (machine_id, recorded_at, temperature_c, vibration_mm_s, power_kw, production_rate) SELECT machine_id, NOW() - number * INTERVAL '1 millisecond', 68 + (number % 5) * 0.1, 2.5 + (number % 7) * 0.02, 17 + (number % 3) * 0.1, 44 + (number % 2) FROM (VALUES ('press-01'), ('press-02')) AS machines(machine_id) CROSS JOIN generate_series(1, 120) AS number;"
          ML_MACHINE_IDS=press-01,press-02 docker compose --profile tools run --rm model-evaluator
          evaluation_count=$(docker compose exec -T timescaledb psql \
            -U smart_factory -d smart_factory -At \
            -c "SELECT COUNT(*) FROM model_evaluation_runs WHERE passed AND artifact_sha256 ~ '^[0-9a-f]{64}$' AND (SELECT COUNT(*) FROM jsonb_object_keys(feature_psi)) = 4")
          test "$evaluation_count" = "2"
          AUDIT_ACTOR=github-actions AUDIT_REASON=ci-model-promotion AUDIT_CORRELATION_ID=11111111-1111-1111-1111-111111111111 ML_MACHINE_IDS=press-01,press-02 docker compose --profile tools run --rm model-promoter
          docker compose --profile tools run --rm audit-verifier
          audit_event_count=$(docker compose exec -T timescaledb psql \
            -U smart_factory -d smart_factory -At \
            -c "SELECT COUNT(*) FROM operator_audit_events WHERE actor = 'github-actions' AND correlation_id = '11111111-1111-1111-1111-111111111111' AND outcome IN ('started', 'succeeded')")
          test "$audit_event_count" = "2"
          sudo install -d -o 10001 -g "$(id -g)" -m 0770 audit-checkpoints
          AUDIT_CHAIN_ID=github-actions:${{ github.repository }} AUDIT_CHECKPOINT_NAME=ci-checkpoint.json docker compose --profile tools run --rm audit-checkpoint-exporter
          AUDIT_CHAIN_ID=github-actions:${{ github.repository }} AUDIT_CHECKPOINT_NAME=ci-checkpoint.json docker compose --profile tools run --rm audit-checkpoint-verifier
          cp audit-checkpoints/ci-checkpoint.json audit-checkpoints/tampered-checkpoint.json
          python -c "import json; from pathlib import Path; path = Path('audit-checkpoints/tampered-checkpoint.json'); document = json.loads(path.read_text()); document['checkpoint']['event_count'] += 1; path.write_text(json.dumps(document))"
          if AUDIT_CHAIN_ID=github-actions:${{ github.repository }} AUDIT_CHECKPOINT_NAME=tampered-checkpoint.json docker compose --profile tools run --rm audit-checkpoint-verifier; then
            echo "tampered audit checkpoint unexpectedly verified"
            exit 1
          fi
          AUDIT_ACTOR=github-actions AUDIT_REASON=ci-attestation-key-rotation AUDIT_CORRELATION_ID=22222222-2222-2222-2222-222222222222 AUDIT_CHAIN_ID=github-actions:${{ github.repository }} docker compose --profile tools run --rm audit-key-rotator
          AUDIT_CHAIN_ID=github-actions:${{ github.repository }} AUDIT_CHECKPOINT_NAME=post-rotation-checkpoint.json docker compose --profile tools run --rm audit-checkpoint-exporter
          AUDIT_CHAIN_ID=github-actions:${{ github.repository }} AUDIT_CHECKPOINT_NAME=ci-checkpoint.json docker compose --profile tools run --rm audit-checkpoint-verifier
          AUDIT_CHAIN_ID=github-actions:${{ github.repository }} AUDIT_CHECKPOINT_NAME=post-rotation-checkpoint.json docker compose --profile tools run --rm audit-checkpoint-verifier
          rotation_event_count=$(docker compose exec -T timescaledb psql \
            -U smart_factory -d smart_factory -At \
            -c "SELECT COUNT(*) FROM operator_audit_events WHERE actor = 'github-actions' AND correlation_id = '22222222-2222-2222-2222-222222222222' AND action = 'audit_attestation_key_rotation' AND outcome IN ('started', 'succeeded')")
          test "$rotation_event_count" = "2"
          if docker compose exec -T timescaledb psql \
            -U smart_factory -d smart_factory -v ON_ERROR_STOP=1 \
            -c "UPDATE operator_audit_events SET reason = 'tampered'"; then
            echo "operator audit mutation unexpectedly succeeded"
            exit 1
          fi
          docker compose run --rm --no-deps consumer python -c \
            "from pathlib import Path; from smart_factory.infrastructure.ml.registry import MachineModelRegistry; MachineModelRegistry.load(Path('/models'), public_key_path=Path('/run/ml-signing/public/public.pem'))"
          test "$(docker compose exec -T mosquitto sh -c 'find /mosquitto/config-generated -name "*.tmp" -print')" = ""
          allowed_publish=$(docker compose exec -T mosquitto mosquitto_pub \
            -d -V mqttv5 -h localhost -u smart-factory-simulator -P simulator_dev \
            -q 1 -t factory/hall-a/press-01/telemetry -m '{}' 2>&1)
          echo "$allowed_publish" | grep -Eq 'RC:(0|16)'
          denied_publish=$(docker compose exec -T mosquitto mosquitto_pub \
            -d -V mqttv5 -h localhost -u smart-factory-simulator -P simulator_dev \
            -q 1 -t factory/hall-a/press-02/telemetry -m '{}' 2>&1)
          echo "$denied_publish" | grep -q 'RC:135'
          anonymous_publish=$(docker compose exec -T mosquitto mosquitto_pub \
            -d -V mqttv5 -h localhost -q 1 \
            -t factory/hall-a/press-01/telemetry -m '{}' 2>&1 || true)
          echo "$anonymous_publish" | grep -q 'CONNACK (135)'
          ALERT_WEBHOOK_URL=https://alerts.example.invalid/hook ML_ANOMALY_DETECTION_ENABLED=true ML_MACHINE_IDS=press-01,press-02 docker compose up -d --wait mosquitto consumer simulator
          curl --fail --silent http://127.0.0.1:8000/readyz
          curl --fail --silent http://127.0.0.1:8000/metrics | grep -q 'smart_factory_ml_models_loaded 2'
          for attempt in $(seq 1 20); do
            reading_count=$(docker compose exec -T timescaledb psql \
              -U smart_factory -d smart_factory -At \
              -c "SELECT COUNT(*) FROM telemetry_readings")
            if [ "$reading_count" -gt 240 ]; then break; fi
            sleep 1
          done
          test "$reading_count" -gt 240
          alert_timestamp=$(date -u +%Y-%m-%dT%H:%M:%S.%6NZ)
          docker compose exec -T mosquitto mosquitto_pub \
            -V mqttv5 -h localhost -u smart-factory-simulator -P simulator_dev \
            -q 1 -t factory/hall-a/press-01/telemetry \
            -m "{\"machine_id\":\"press-01\",\"timestamp\":\"$alert_timestamp\",\"temperature_c\":95.0,\"vibration_mm_s\":2.5,\"power_kw\":17.0,\"production_rate\":44}"
          for attempt in $(seq 1 20); do
            alert_count=$(docker compose exec -T timescaledb psql \
              -U smart_factory -d smart_factory -At \
              -c "SELECT COUNT(*) FROM anomaly_alert_outbox")
            if [ "$alert_count" -gt 0 ]; then break; fi
            sleep 1
          done
          test "$alert_count" -gt 0
          docker compose stop consumer simulator
          source_reading_count=$(docker compose exec -T timescaledb psql \
            -U smart_factory -d smart_factory -At \
            -c "SELECT COUNT(*) FROM telemetry_readings")
          source_finding_count=$(docker compose exec -T timescaledb psql \
            -U smart_factory -d smart_factory -At \
            -c "SELECT COUNT(*) FROM anomaly_findings")
          source_alert_count=$(docker compose exec -T timescaledb psql \
            -U smart_factory -d smart_factory -At \
            -c "SELECT COUNT(*) FROM anomaly_alert_outbox")
          source_evaluation_count=$(docker compose exec -T timescaledb psql \
            -U smart_factory -d smart_factory -At \
            -c "SELECT COUNT(*) FROM model_evaluation_runs")
          source_audit_event_count=$(docker compose exec -T timescaledb psql \
            -U smart_factory -d smart_factory -At \
            -c "SELECT COUNT(*) FROM operator_audit_events")
          source_migration_count=$(docker compose exec -T timescaledb psql \
            -U smart_factory -d smart_factory -At \
            -c "SELECT COUNT(*) FROM schema_migrations")
          source_foreign_key_count=$(docker compose exec -T timescaledb psql \
            -U smart_factory -d smart_factory -At \
            -c "SELECT COUNT(*) FROM pg_constraint WHERE contype = 'f' AND connamespace = 'public'::regnamespace")
          BACKUP_ID=ci-roundtrip docker compose --profile recovery run --rm backup-create
          BACKUP_ID=ci-roundtrip RESTORE_DATABASE_NAME=smart_factory_restore \
            docker compose --profile recovery run --rm backup-restore
          test "$(docker compose exec -T timescaledb psql -U smart_factory -d smart_factory_restore -At -c 'SELECT COUNT(*) FROM telemetry_readings')" = "$source_reading_count"
          test "$(docker compose exec -T timescaledb psql -U smart_factory -d smart_factory_restore -At -c 'SELECT COUNT(*) FROM anomaly_findings')" = "$source_finding_count"
          test "$(docker compose exec -T timescaledb psql -U smart_factory -d smart_factory_restore -At -c 'SELECT COUNT(*) FROM anomaly_alert_outbox')" = "$source_alert_count"
          test "$(docker compose exec -T timescaledb psql -U smart_factory -d smart_factory_restore -At -c 'SELECT COUNT(*) FROM model_evaluation_runs')" = "$source_evaluation_count"
          test "$(docker compose exec -T timescaledb psql -U smart_factory -d smart_factory_restore -At -c 'SELECT COUNT(*) FROM operator_audit_events')" = "$source_audit_event_count"
          test "$(docker compose exec -T timescaledb psql -U smart_factory -d smart_factory_restore -At -c 'SELECT COUNT(*) FROM schema_migrations')" = "$source_migration_count"
          restored_foreign_key_count=$(docker compose exec -T timescaledb psql \
            -U smart_factory -d smart_factory_restore -At \
            -c "SELECT COUNT(*) FROM pg_constraint WHERE contype = 'f' AND connamespace = 'public'::regnamespace AND convalidated")
          test "$restored_foreign_key_count" = "$source_foreign_key_count"
          ML_MACHINE_IDS=press-01,press-02 docker compose --profile recovery run --rm recovery-model-verifier
      - name: Retain signed audit checkpoint outside the database
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operator-audit-checkpoint-${{ github.sha }}
          path: |
            audit-checkpoints/ci-checkpoint.json
            audit-checkpoints/post-rotation-checkpoint.json
          if-no-files-found: error
          retention-days: 30
      - name: Stop Compose services
        if: always()
        run: docker compose down -v
