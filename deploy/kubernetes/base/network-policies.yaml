apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smart-factory-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: smart-factory-monitor
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smart-factory-dns-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: smart-factory-monitor
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smart-factory-simulator-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smart-factory-simulator
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8883
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smart-factory-consumer-traffic
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smart-factory-consumer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: smart-factory-monitor
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8883
        - protocol: TCP
          port: 5432
