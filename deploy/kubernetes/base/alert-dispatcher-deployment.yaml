apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-factory-alert-dispatcher
  labels:
    app.kubernetes.io/name: smart-factory-alert-dispatcher
    app.kubernetes.io/part-of: smart-factory-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smart-factory-alert-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smart-factory-alert-dispatcher
        app.kubernetes.io/part-of: smart-factory-monitor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alert-dispatcher
          image: smart-factory-monitor:0.17.0
          imagePullPolicy: IfNotPresent
          command: ["smart-factory-alert-dispatcher"]
          envFrom:
            - configMapRef:
                name: smart-factory-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smart-factory-runtime
                  key: database-url
            - name: ALERT_WEBHOOK_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: smart-factory-runtime
                  key: alert-webhook-token
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
