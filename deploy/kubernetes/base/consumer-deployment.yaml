apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-factory-consumer
  labels:
    app.kubernetes.io/name: smart-factory-consumer
    app.kubernetes.io/part-of: smart-factory-monitor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: smart-factory-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smart-factory-consumer
        app.kubernetes.io/part-of: smart-factory-monitor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consumer
          image: smart-factory-monitor:0.20.0
          imagePullPolicy: IfNotPresent
          command: ["smart-factory-consumer"]
          envFrom:
            - configMapRef:
                name: smart-factory-config
          env:
            - name: MQTT_CONSUMER_CLIENT_ID
              value: smart-factory-consumer
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smart-factory-runtime
                  key: consumer-mqtt-username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-factory-runtime
                  key: consumer-mqtt-password
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smart-factory-runtime
                  key: database-url
          ports:
            - name: monitoring
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: monitoring
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: mqtt-tls
              mountPath: /etc/mqtt-tls
              readOnly: true
            - name: model-registry
              mountPath: /models
              readOnly: true
            - name: model-signing-public-key
              mountPath: /etc/model-signing
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mqtt-tls
          secret:
            secretName: consumer-mqtt-tls
            defaultMode: 0440
        - name: model-registry
          persistentVolumeClaim:
            claimName: smart-factory-models
        - name: model-signing-public-key
          secret:
            secretName: model-signing-public-key
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
